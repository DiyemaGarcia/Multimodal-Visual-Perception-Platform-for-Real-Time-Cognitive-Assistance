name: vae_morphosyntax
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - cudatoolkit=12.1
  - pytorch=2.1.0
  - torchvision=0.16.0
  - numpy=1.24.0
  - scipy=1.11.0
  - scikit-learn=1.3.0
  - matplotlib=3.7.0
  - seaborn=0.12.0
  - jupyter=1.0.0
  - ipywidgets=8.0.0
  - pyyaml=6.0.1
  - cmake=3.27.0
  - ninja

  - pip:
      - spacy>=3.7.0
      - nltk>=3.8.0
      - tokenizers>=0.15.0
      - conllu>=4.5.0
      - fasttext>=0.9.2
      - umap-learn>=0.5.3
      - plotly>=5.17.0
      - tensorboard>=2.14.0
      - wandb>=0.16.0
      - pytest>=7.4.0
      - pytest-cov>=4.1.0