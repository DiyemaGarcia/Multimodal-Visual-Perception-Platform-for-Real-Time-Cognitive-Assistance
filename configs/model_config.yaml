model:
  name: "vae_morphosyntax"
  level: "subword"  # Options: "char", "subword", "word"

encoder:
  type: "bilstm"  # Options: "bilstm", "transformer"
  embedding_dim: 256
  hidden_dim: 512
  num_layers: 2
  dropout: 0.3
  bidirectional: true

decoder:
  type: "lstm"
  embedding_dim: 256
  hidden_dim: 256 # 512
  num_layers: 1 # 2
  dropout: 0.3

latent_space:
  z_dim: 128
  morpho_dim: 64       # Dimensions dedicated to morphological structure
  syntax_dim: 64       # Dimensions dedicated to syntactic structure
  prior: "standard"   # Options: "standard", "vmf", "horseshoe"

attention:
  use_attention: true
  num_heads: 8
  dropout: 0.1

embeddings:
  pretrained: true
  fasttext_path: "data/embeddings/fasttext_en.bin"
  freeze: false
  dim: 300