training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.0001
  optimizer: "adam"       # Options: "adam", "adamw", "sgd"
  weight_decay: 0.00001
  gradient_clip: 5.0
  mixed_precision: true   # Use torch.cuda.amp

scheduler:
  type: "cosine"          # Options: "cosine", "step", "plateau"
  warmup_epochs: 5
  min_lr: 0.000001

kl_annealing:
  strategy: "monotonic"    # Options: "linear", "cyclical", "monotonic"
  start: 0.0
  stop: 1.0
  n_cycles: 2
  beta_max: 2.0 # 0.5           # For beta-VAE objective

elbo:
  reconstruction_weight: 1.0
  kl_weight: 2.0 # 1.0
  morpho_constraint_weight: 0.5
  syntax_constraint_weight: 0.5

checkpointing:
  save_every: 5           # Save checkpoint every N epochs
  keep_last: 3
  save_best: true
  monitor: "val_elbo"

early_stopping:
  patience: 50
  min_delta: 0.001
  monitor: "val_elbo"

logging:
  use_tensorboard: true
  use_wandb: false
  log_every: 100          # Log every N steps
  wandb_project: "vae_morphosyntax"