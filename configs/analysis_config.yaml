analysis:
  batch_size: 256
  device: "cuda"

dimensionality_reduction:
  methods:
    - "pca"
    - "tsne"
    - "umap"
  pca:
    n_components: 50
  tsne:
    n_components: 2
    perplexity: 30
    n_iter: 1000
    random_state: 42
  umap:
    n_components: 2
    n_neighbors: 15
    min_dist: 0.1
    random_state: 42

clustering:
  methods:
    - "kmeans"
    - "gmm"
  kmeans:
    n_clusters: [5, 10, 17, 20]  # 17 = number of UPOS tags
    n_init: 10
    random_state: 42
  gmm:
    n_components: [5, 10, 17, 20]
    covariance_type: "full"
    random_state: 42

probing:
  targets:
    - "upos"          # Universal POS tags
    - "deprel"        # Dependency relations
    - "morph_feats"   # Morphological features (Number, Case, Tense...)
  classifier: "logistic_regression"
  max_iter: 1000
  cv_folds: 5

correlation:
  methods:
    - "spearman"
    - "pearson"
  linguistic_categories:
    - "upos"
    - "number"
    - "tense"
    - "person"
    - "case"
    - "mood"
    - "voice"

disentanglement:
  metrics:
    - "beta_vae_score"
    - "mig"           # Mutual Information Gap
    - "dci"           # Disentanglement, Completeness, Informativeness
  num_samples: 10000

visualization:
  output_dir: "outputs/figures/"
  dpi: 150
  format: "png"
  interactive: true   # Also generate Plotly HTML versions