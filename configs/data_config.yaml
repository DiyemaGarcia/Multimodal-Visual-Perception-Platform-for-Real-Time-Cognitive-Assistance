data:
  language: "english"
  levels:
    - "char"
    - "subword"
    - "word"
  active_level: "subword"

paths:
  ud_english_train: "data/raw/ud_english/en_ewt-ud-train.conllu"
  ud_english_dev: "data/raw/ud_english/en_ewt-ud-dev.conllu"
  ud_english_test: "data/raw/ud_english/en_ewt-ud-test.conllu"
  ud_french_train: "data/raw/ud_french/fr_gsd-ud-train.conllu"
  ud_french_dev: "data/raw/ud_french/fr_gsd-ud-dev.conllu"
  ud_french_test: "data/raw/ud_french/fr_gsd-ud-test.conllu"
  morpho_train: "data/raw/morpho_challenge/english.train"
  morpho_gold: "data/raw/morpho_challenge/english.gold"
  wiktionary: "data/raw/wiktionary/en_wiktionary_morph.tsv"
  fasttext: "data/embeddings/fasttext_en.bin"
  processed_dir: "data/processed/"

vocabulary:
  max_vocab_size: 50000
  min_freq: 2
  special_tokens:
    pad: "<PAD>"
    unk: "<UNK>"
    bos: "<BOS>"
    eos: "<EOS>"
    sep: "<SEP>"

preprocessing:
  max_seq_len: 50
  min_seq_len: 2
  subword_vocab_size: 8000  # BPE merges
  lowercase: false
  strip_accents: false

splits:
  use_ud_splits: true       # Used official UD train/dev/test splits
  dev_ratio: 0.1            # Used only if use_ud_splits is false
  test_ratio: 0.1
  seed: 42